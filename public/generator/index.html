<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>AI Report Generator &middot; Akshara Academy</title>
  <link rel="stylesheet" href="/styles.css?v=38" />
  <link rel="stylesheet" href="/generator/generator.css?v=7" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="page">
    <header class="hero" style="justify-content:space-between;flex-wrap:wrap;gap:12px;">
      <div style="display:flex;align-items:center;gap:14px;">
        <img class="crest" src="/logo.jpg" alt="KSR Logo" />
        <div class="hero-text">
          <h1>AI Report Generator</h1>
          <p>Evaluate your answer sheet with AI</p>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
        <a href="/" class="status-pill" style="text-decoration:none;color:#ffffff;display:inline-flex;align-items:center;gap:6px;padding:8px 14px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:6px;font-weight:600;font-size:0.88rem;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          <span>Back to Main Page</span>
        </a>
      </div>
    </header>

    <!-- ===================== GENERATOR ===================== -->
    <section class="lookup-card gen-card" id="genCard">
      <h2>Evaluate a student&rsquo;s answer sheet</h2>
      <p class="hint">Provide the question paper and the student&rsquo;s written answers &mdash; both are required. Paste text or upload a PDF / photo for each.</p>

      <form id="genForm" autocomplete="off">
        <div class="gen-block">
          <label class="gen-label">1. Syllabus <span class="opt">(optional)</span></label>
          <textarea class="gen-text" id="syllabusText" rows="2" placeholder="Paste syllabus text&hellip;"></textarea>
          <div class="gen-file-row">
            <label class="gen-upload-btn btn-pdf">
              <input type="file" id="syllabusFile" accept="application/pdf,.pdf" />
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              <span>Choose PDF / File</span>
            </label>
            <label class="gen-upload-btn btn-photo">
              <input type="file" id="syllabusPhoto" accept="image/*" />
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span>Upload Photo / Camera</span>
            </label>
          </div>
          <div id="syllabusFileBadge" class="file-selected-badge">
            <span class="file-name-text"></span>
            <button type="button" class="btn-remove-file" aria-label="Remove file">&times;</button>
          </div>
        </div>

        <div class="gen-block">
          <label class="gen-label">2. Question Paper <span class="req">(required)</span></label>
          <textarea class="gen-text" id="questionText" rows="2" placeholder="Paste question paper text&hellip;"></textarea>
          <div class="gen-file-row">
            <label class="gen-upload-btn btn-pdf">
              <input type="file" id="questionFile" accept="application/pdf,.pdf" />
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              <span>Choose PDF / File</span>
            </label>
            <label class="gen-upload-btn btn-photo">
              <input type="file" id="questionPhoto" accept="image/*" multiple />
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span>Upload Photo / Camera</span>
            </label>
          </div>
          <div id="questionFileBadge" class="file-selected-badge">
            <span class="file-name-text"></span>
            <button type="button" class="btn-remove-file" aria-label="Remove file">&times;</button>
          </div>
        </div>

        <div class="gen-block">
          <label class="gen-label">3. Written Answer Sheet <span class="req">(required)</span></label>
          <textarea class="gen-text" id="answerText" rows="2" placeholder="Paste typed answers, or upload a scan/photo below&hellip;"></textarea>
          <div class="gen-file-row">
            <label class="gen-upload-btn btn-pdf">
              <input type="file" id="answerFile" accept="application/pdf,.pdf" />
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
              <span>Choose PDF / File</span>
            </label>
            <label class="gen-upload-btn btn-photo">
              <input type="file" id="answerPhoto" accept="image/*" multiple />
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
              <span>Upload Photo / Camera</span>
            </label>
          </div>
          <div id="answerFileBadge" class="file-selected-badge">
            <span class="file-name-text"></span>
            <button type="button" class="btn-remove-file" aria-label="Remove file">&times;</button>
          </div>
        </div>

        <div class="gen-block">
          <label class="gen-label">Extra instructions <span class="opt">(optional)</span></label>
          <textarea class="gen-text" id="notesText" rows="2" placeholder="e.g. Total is 100 marks, be lenient on spelling&hellip;"></textarea>
        </div>

        <button type="submit" id="genBtn" class="btn-primary">Generate Report</button>

      </form>

      <div id="genMsg" class="message" role="status"></div>
    </section>

    <!-- ===================== RESULT ===================== -->
    <section id="genResultWrap" class="report-wrap" hidden>
      <div class="report-toolbar no-print">
        <button id="printGenBtn" class="btn-ghost">
          <svg viewBox="0 0 24 24" class="btn-ic"><path d="M6 9V3h12v6"/><rect x="5" y="9" width="14" height="7" rx="1"/><path d="M8 16h8v5H8z"/></svg>
          <span>Print / Save PDF</span>
        </button>
        <button id="genBackBtn" class="btn-ghost">
          <svg viewBox="0 0 24 24" class="btn-ic"><path d="M15 5l-7 7 7 7"/></svg>
          <span>New Evaluation</span>
        </button>
      </div>
      <div id="genReport" class="report"></div>
    </section>
  </div>



  <script src="/generator/generator.js?v=7"></script>
</body>
</html>
