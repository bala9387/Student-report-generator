<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Performance Report</title>
  <link rel="stylesheet" href="styles.css?v=35" />
</head>
<body>
  <div class="page">
    <!-- ===================== HERO ===================== -->
    <header class="hero">
      <img class="crest" src="logo.jpg" alt="KSR Logo" />
      <div class="hero-text">
        <h1>Student Performance Report</h1>
        <p>Grade XII &middot; Team Elevate 2027 &middot; Parent Portal</p>
      </div>
      <button id="statusPill" class="status-pill loading" type="button" title="Data source" style="display: none;">
        <span class="dot"></span><span id="statusText">Connecting&hellip;</span>
      </button>
    </header>

    <!-- ===================== LOOKUP ===================== -->
    <section class="lookup-card" id="lookupCard">
      <h2>View your child&rsquo;s report</h2>
      <p class="hint">Enter the student&rsquo;s Roll Number and choose the exam mode.</p>

      <form id="lookupForm" autocomplete="off">
        <div class="field">
          <label for="roll">1. Roll Number</label>
          <input id="roll" name="roll" type="text" inputmode="text"
                 placeholder="Enter Roll Number" required />
        </div>

        <div class="field">
          <label for="mode">2. Mode of Exam</label>
          <select id="mode" name="mode" required>
            <option value="PE - Analysis">PE - Analysis</option>
            <option value="CU 1" selected>CU 1</option>
            <option value="TE 1">TE 1</option>
            <option value="CU 2">CU 2</option>
            <option value="TE 2">TE 2</option>
          </select>
        </div>

        <button type="submit" id="submitBtn" class="btn-primary" disabled>Get Report</button>
      </form>

      <div id="message" class="message" role="status"></div>

      <div class="lb-links">
        <p class="hint">Or view class rankings</p>
        <div class="lb-btns">
          <button type="button" id="topSchoolBtn" class="btn-ghost" disabled>🏆 Top Performers</button>
          <button type="button" id="topStreamBtn" class="btn-ghost" disabled>🥇 Top Performers by Stream</button>
        </div>
      </div>
    </section>

    <!-- ===================== REPORT ===================== -->
    <section id="reportWrap" class="report-wrap" hidden>
      <div class="report-toolbar no-print">
        <button id="downloadBtn" class="btn-primary">
          <svg viewBox="0 0 24 24" class="btn-ic"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M5 21h14"/></svg>
          <span>Download PDF</span>
        </button>
        <button id="printBtn" class="btn-ghost">
          <svg viewBox="0 0 24 24" class="btn-ic"><path d="M6 9V3h12v6"/><rect x="5" y="9" width="14" height="7" rx="1"/><path d="M8 16h8v5H8z"/></svg>
          <span>Print</span>
        </button>
<button id="backBtn" class="btn-ghost">
          <svg viewBox="0 0 24 24" class="btn-ic"><path d="M15 5l-7 7 7 7"/></svg>
          <span>New Search</span>
        </button>
      </div>
      <div id="report" class="report"></div>
    </section>


  </div>

  <!-- LOGIN MODAL -->
  <div id="loginOverlay" class="login-overlay" hidden>
    <div class="login-card">
      <div class="login-header">
        <img src="logo.jpg" alt="KSR Logo" class="login-logo" />
        <h2>Staff Access</h2>
        <p>Sign in to view Top Performers</p>
      </div>
      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="loginUser">Username</label>
          <input id="loginUser" type="text" placeholder="Username" required autocomplete="username" />
        </div>
        <div class="field">
          <label for="loginPass">Password</label>
          <input id="loginPass" type="password" placeholder="Password" required autocomplete="current-password" />
        </div>
        <div id="loginMsg" class="message" role="status"></div>
        <button type="submit" id="loginBtn" class="btn-primary">Sign In</button>
        <button type="button" id="loginCancelBtn" class="btn-ghost login-cancel">Cancel</button>
      </form>
    </div>
  </div>

  <!-- data.js / datasource.js are backend-only now (see server.js) — the browser
       never talks to Google Sheets directly and never sees the sheet ID. -->
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="app.js?v=35"></script>
</body>
</html>
